# Render blueprint for the API (one instance: the room conductors live in this process).
# New > Blueprint > pick this repo. Fill the env vars marked sync: false in the dashboard.
# The web app goes to Vercel (vercel.json); the database is the hosted Supabase project.
services:
  - type: web
    name: chalkroom-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start -w @chalk/api
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REQUIRE_ACCOUNT
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_URL
        sync: false
      # model: the first key set wins: ANTHROPIC_API_KEY (production, Claude Haiku 5.5, paid),
      # then GEMINI_API_KEY, then GROQ_API_KEY (free tiers, testing only). One is required:
      # the API refuses to start without a model key (there is no scripted tutor).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # mail for 2FA codes and account notices
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OTP_SECRET
        generateValue: true
