# Fly.io config for the API. ONE machine only: the room conductors live in this process.
# First deploy: fly launch --no-deploy --copy-config (pick a free app name), set the secrets
# (docs/DEPLOY.md; a model key such as ANTHROPIC_API_KEY is required: without one the API
# refuses to start), then: fly deploy --ha=false
app = "chalkroom-api"
primary_region = "lhr"  # nearest to the Supabase project (eu-west-1, Ireland)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  REQUIRE_ACCOUNT = "1"
  SANDBOX = "0"
  # server voice (Kokoro, docs/DEPLOY.md): every narration sentence made once, stored in the tts bucket
  TTS = "kokoro"
  TTS_THREADS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  # a stopped machine would drop live classes and the conductors' timers
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # Node + the embeddings model + the Kokoro voice (~750 MB resident). The voice needs two dedicated
  # cores to make speech faster than the class plays it (RTF ~0.55 on 2 threads); a shared vCPU
  # is throttled to a fraction of a core and falls behind. TTS=off fits the old 1 GB shared machine.
  size = "performance-2x"
  memory = "4gb"
