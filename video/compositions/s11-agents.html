          '<div class="s11-l" style="left:44px;top:282px">მრუდის გარეთაა, გასაღები არ აქვს.</div>' +
          '<div class="s11-t" style="left:44px;top:350px">ძირითადი</div>' +
          '<div class="s11-l" style="left:44px;top:400px">• ხელს მხოლოდ პროგრამა აწერს</div>' +
          '<div class="s11-l" style="left:44px;top:442px">• bump: პირველი, 255-დან ქვემოთ</div>' +
          '<div class="s11-l" style="left:44px;top:484px">• programId ჰეშში შედის</div>' +
          '<div class="s11-t" style="left:724px;top:190px">კლასის კითხვები</div>' +
          '<div class="s11-q" style="left:724px;top:236px;font-size:30px;line-height:1.15">რატომ ვერ აწერს<br>PDA ხელს?</div>' +
          '<div class="s11-l" style="left:724px;top:318px;font-size:28px;color:var(--ink-2)">გასაღები არ არსებობს.</div>' +
          '<div class="s11-fc s11-fb" style="transform:translate(-34px,6px) rotate(-8deg)"></div><div class="s11-fc s11-fb" style="transform:translate(26px,-4px) rotate(5deg)"></div>' +
          '<div class="s11-fc"><span class="mono">1/3</span><div class="s11-cq">ვის შეუძლია PDA-ს<br>ხელის მოწერა?</div></div>';
        tile.appendChild(recap);
        Kit.hydrateIcons(S.root);

        const scr = qa('.s11-scr');
        const scr4 = scr.slice(0, 4);           // the four people already in class
        const seat5 = q('.s11-scr5');
        const camera = q('.s11-camera');
        const sel = (cls, list) => list.flatMap((s) => Array.from(s.querySelectorAll(cls)));

        /* ---------- ledger rows ---------- */
        const ledger = q('.s11-ledger');
        const MK = { lead: '<b class="h-or"></b>', thread: '<b class="h-te"></b>', triage: '<b class="h-ul"></b>', scribe: '<b class="h-vi"></b>' };
        const ROWS = [
          { n: '#37', k: 'segment_start', m: ['lead'] },
          { n: '#38', k: 'board', m: ['lead'] },
          { n: '#39', k: 'board', m: ['lead'] },
          { n: '#40', k: 'board', m: ['lead'] },
          { n: '#41', k: 'check', m: ['lead'], t: 10.29, from: 1, el: '.s11-e41s' },
          { n: '#42', k: 'answer_cluster', m: ['triage', 'lead'], t: 10.86, from: 3, el: '.s11-e42s' },
          { branch: true, k: 'chat', m: ['thread'], t: 11.43, from: 2 },
          { n: '#43', k: 'segment_summary', m: ['scribe'], t: 12.0, from: 4, el: '.s11-e43s' },
          { n: '#44', k: 'segment_start', m: ['lead'], t: 12.57, from: 1, el: '.s11-e44s' },
          { n: '#45', k: 'board', m: ['lead'], t: 13.14, from: 1, el: '.s11-e45s' },
        ];
        ROWS.forEach((r, i) => {
          const d = document.createElement('div');
          d.className = 's11-row' + (r.t ? '' : ' s11-old') + (r.branch ? ' s11-branch' : '');
          d.style.top = (84 + 14 + i * 64) + 'px';
          d.innerHTML = r.branch
            ? '<span class="s11-n">თემა · <span class="mono">#3</span></span><span class="s11-k mono">chat</span><span class="s11-m">' + MK.thread + '</span>'
            : '<span class="s11-n">' + r.n + '</span><span class="s11-k">' + r.k + '</span><span class="s11-m">' + r.m.map((x) => MK[x]).join('') + '</span>';
          ledger.appendChild(d);
          r.row = d;
          r.mid = 120 + 84 + 14 + i * 64 + 32; // frame y of the row centre
        });

        /* ---------- phase 2 wires ---------- */
        const wire = q('.s11-wire');
        const mk = (tag, attrs, cls) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          e.setAttribute('class', 'stroke ' + (cls || ''));
          wire.appendChild(e);
          return e;
        };
        const W = { x: 580, y: 478 };
        const TAGY = [140, 260, 380, 500].map((y) => y + 40);
        const HUES = ['var(--h-orange)', 'var(--h-teal)', 'var(--h-ultra)', 'var(--h-violet)'];
        const tagLines = TAGY.map((y) => mk('polyline', { points: '528,' + y + ' 548,' + y + ' ' + W.x + ',' + W.y }, 's11-faint'));
        const tagHot = TAGY.map((y, i) => { const e = mk('polyline', { points: '528,' + y + ' 548,' + y + ' ' + W.x + ',' + W.y }, 's11-hot'); e.style.stroke = HUES[i]; return e; });
        // screen centres in phase 2 (scale 0.5)
        const SC = [[1390, 235], [1700, 235], [1390, 430], [1700, 430], [1545, 625]];

        /* ================= PHASE 1 ================= */
        // 0.30 the recap tile swaps into the classroom screen (short blur)
        const tileBody = [tile.querySelector('.s11-bar'), tile.querySelector('.s11-mb')];
        tl.fromTo(recap, { filter: 'blur(0px)', opacity: 1 }, { filter: 'blur(8px)', opacity: 0, duration: 0.18, ease: 'steps(3)', immediateRender: false }, 0.3);
        tl.set(recap, { visibility: 'hidden' }, 0.48);
        tl.fromTo(tileBody, { filter: 'blur(8px)', opacity: 0 }, { filter: 'blur(0px)', opacity: 1, duration: 0.2, ease: 'steps(3)', immediateRender: false }, 0.4);
        tl.set(tileBody, { opacity: 0 }, 0);
        // the tile shows "კლასი" until it becomes ანა's screen
        Kit.textAt(tl, tile.querySelector('.s11-who'), [[0, 'კლასი'], [9.7, 'ანა']]);
        tl.set(tile.querySelector('.s11-dot'), { visibility: 'hidden' }, 0);
        tl.set(tile.querySelector('.s11-dot'), { visibility: 'visible' }, 9.7);

        // headline
        Kit.stepIn(tl, q('.s11-kicker'), 0.86, { y: 8 });
        Kit.stepIn(tl, q('.s11-head'), 1.0, { y: 10 });

        // the classroom board plots on the tile
        Kit.plot(tl, tile.querySelector('.s11-h1'), 0.9, { dur: 0.36 });
        Kit.plot(tl, tile.querySelector('.s11-h2'), 1.2, { dur: 0.36 });
        Kit.plot(tl, tile.querySelector('.s11-h3'), 1.5, { dur: 0.36 });
        Kit.plot(tl, tile.querySelector('.s11-h4'), 1.8, { dur: 0.36 });

        // a slow camera drift for life
        gsap.set(camera, { scale: 1 });
        Kit.camera(tl, camera, 0.6, { scale: 0.965 }, { dur: 8.2, ease: 'sine.inOut' });

        // four cards, one per beat
        const cards = [q('.s11-c1'), q('.s11-c2'), q('.s11-c3'), q('.s11-c4')];
        const CT = [2.29, 2.86, 3.43, 4.0];
        cards.forEach((c, i) => Kit.hingeIn(tl, c, CT[i]));

        // elbows plot
        const elbows = [1, 2, 3, 4].map((i) => q('.s11-el' + i));
        Kit.plot(tl, elbows, 4.57, { dur: 0.48, stagger: 0.1 });

        // each agent named: ring, hot elbow, packet into the tile, tile pulses
        const PK = [
          [[360, 240], [360, 330], [680, 330]],
          [[1560, 240], [1560, 330], [1240, 330]],
          [[360, 650], [360, 570], [680, 570]],
          [[1560, 650], [1560, 570], [1240, 570]],
        ];
        const HT = [5.71, 6.57, 7.43, 8.29];
        const pulses = { tile: [] };
        HT.forEach((t, i) => {
          const ring = cards[i].querySelector('.s11-ring');
          tl.set(ring, { visibility: 'visible' }, t);
          tl.set(ring, { visibility: 'hidden' }, t + 0.8);
          Kit.plot(tl, q('.s11-eh' + (i + 1)), t, { dur: 0.36, steps: 6 });
          tl.set(q('.s11-eh' + (i + 1)), { visibility: 'hidden' }, t + 0.8);
          const pk = q('.s11-pk' + (i + 1));
          const p = PK[i];
          tl.set(pk, { visibility: 'hidden' }, 0);
          gsap.set(pk, { xPercent: -50, yPercent: -50, x: p[0][0], y: p[0][1] });
          tl.set(pk, { visibility: 'visible', x: p[0][0], y: p[0][1] }, t + 0.05);
          tl.to(pk, { y: p[1][1], duration: 0.14, ease: 'steps(2)' }, t + 0.1);
          tl.to(pk, { x: p[2][0] + (i % 2 ? 70 : -70), duration: 0.3, ease: 'steps(4)' }, t + 0.26);
          tl.set(pk, { visibility: 'hidden' }, t + 0.62);
          pulses.tile.push(t + 0.6);
        });
        Kit.track(tl, 0, 9.2, (s) => {
          tile.classList.toggle('s11-hit', pulses.tile.some((p) => s >= p && s < p + 0.18));
        });

        /* ================= PHASE 2 (9.14) ================= */
        const M = 9.14;
        Kit.stepOut(tl, [q('.s11-kicker'), q('.s11-head')], M - 0.1);
        tl.to(q('.s11-elbows'), { opacity: 0, duration: Kit.STEP, ease: 'steps(2)' }, M - 0.05);
        tl.set(q('.s11-elbows'), { visibility: 'hidden' }, M + 0.05);
        Kit.camera(tl, camera, M, { scale: 1 }, { dur: 0.9 });

        // cards -> tags in a left column
        const START = [[80, 70], [1280, 70], [80, 650], [1280, 650]];
        cards.forEach((c, i) => {
          tl.to(c.querySelector('.s11-job'), { opacity: 0, duration: 0.066, ease: 'steps(2)' }, M - 0.05);
          tl.to(c, { x: 80 - START[i][0], y: [140, 260, 380, 500][i] - START[i][1], scale: 0.8, height: 100, duration: 0.8, ease: 'power3.inOut' }, M + i * 0.03);
        });

        // tile -> ანა's screen
        tl.to(tile, { x: 1250 - 680, y: 150 - 280, scale: 0.5, duration: 0.9, ease: 'power3.inOut' }, M);

        // the ledger hinges in with its history, the writer and wires plot
        Kit.hingeIn(tl, ledger, M + 0.8);
        Kit.stepIn(tl, q('.s11-writer'), M + 0.86, { y: 0, scale: 0.8 });
        Kit.plot(tl, tagLines, M + 0.9, { dur: 0.24, stagger: 0.04 });

        // the other four screens step in
        gsap.set([q('.s11-scr2'), q('.s11-scr3'), q('.s11-scr4'), seat5], { scale: 0.5 });
        [q('.s11-scr2'), q('.s11-scr3'), q('.s11-scr4'), seat5].forEach((el, i) => {
          const t = M + 0.6 + i * 0.1 + (i === 3 ? 0.02 : 0);
          tl.set(el, { visibility: 'hidden' }, 0);
          tl.set(el, { visibility: 'visible' }, t);
          tl.fromTo(el, { opacity: 0.4, y: 8, scale: 0.47 }, { opacity: 1, y: 0, scale: 0.5, duration: Kit.STEP, ease: 'steps(2)', immediateRender: false }, t);
        });
        Kit.stepIn(tl, q('.s11-seatlabel'), M + 0.75);
        // others already have the history on their boards; seat 5 is empty until it joins
        const s5hist = ['.s11-h1', '.s11-h2', '.s11-h3', '.s11-h4'].map((c) => seat5.querySelector(c));

        // 10.00 the stamp
        Kit.stamp(tl, q('.s11-stamp'), 10.06, { from: 1.18 });

        // ---- appends: one writer, gap-free numbers, five screens in the same frame
        const seqTimes = [[0, '#40']];
        const scrPulse = [];
        ROWS.filter((r) => r.t).forEach((r) => {
          const t = r.t;
          const hot = tagHot[r.from - 1];
          // agent -> writer
          Kit.plot(tl, hot, t - 0.28, { dur: 0.2, steps: 4 });
          tl.set(hot, { visibility: 'hidden' }, t + 0.45);
          tl.set(hot, { visibility: 'visible' }, t - 0.28);
          // writer -> row slot
          const wl = mk('polyline', { points: (W.x + 34) + ',' + W.y + ' 624,' + r.mid + ' 650,' + r.mid }, '');
          Kit.plot(tl, wl, t - 0.08, { dur: 0.1, steps: 2 });
          tl.set(wl, { visibility: 'hidden' }, t + 0.5);
          tl.set(wl, { visibility: 'visible' }, t - 0.08);
          // the row prints
          Kit.stepIn(tl, r.row, t, { x: -14, y: 0 });
          if (r.from === 3) Kit.stamp(tl, q('.s11-fast'), t + 0.12);
          // broadcast to the screens
          const targets = r.branch ? [1] : (t < 12.0 ? [0, 1, 2, 3] : [0, 1, 2, 3, 4]);
          targets.forEach((si) => {
            const fl = mk('line', { x1: 1150, y1: r.mid, x2: SC[si][0], y2: SC[si][1] }, 's11-faint');
            fl.style.stroke = 'var(--ink)';
            Kit.plot(tl, fl, t + 0.02, { dur: 0.12, steps: 3 });
            tl.set(fl, { visibility: 'hidden' }, t + 0.4);
            tl.set(fl, { visibility: 'visible' }, t + 0.02);
          });
          if (r.branch) {
            // thread stream: only ნიკა sees it, main seq unchanged
            Kit.stepIn(tl, q('.s11-scr2 .s11-tmark'), t + 0.14, { y: 0, scale: 0.6 });
            scrPulse.push([t + 0.14, [1]]);
            return;
          }
          seqTimes.push([t + 0.14, r.n]);
          scrPulse.push([t + 0.14, targets]);
        });
        // newest row marker (one toggle per row)
        const newRows = ROWS.filter((r) => r.t);
        newRows.forEach((r, i) => Kit.classAt(tl, r.row, 's11-new', r.t, newRows[i + 1] ? newRows[i + 1].t : null));

        // board elements: same strokes, same frame, on every screen
        const live4 = scr4;
        Kit.plot(tl, sel('.s11-e41s', live4), 10.43, { dur: 0.3, steps: 4 });
        Kit.fillIn(tl, sel('.s11-e42f', live4), 11.0);
        Kit.plot(tl, sel('.s11-e42s', live4), 11.0, { dur: 0.24, steps: 4 });
        Kit.plot(tl, sel('.s11-e43s', scr), 12.14, { dur: 0.3, steps: 4 });
        // seat 5 fast-forward: history + #41 + #42 replayed before it goes live
        Kit.plot(tl, s5hist, 11.56, { dur: 0.1, steps: 2, stagger: 0.06 });
        Kit.plot(tl, seat5.querySelectorAll('.s11-e41s'), 11.84, { dur: 0.06, steps: 2 });
        Kit.fillIn(tl, seat5.querySelector('.s11-e42f'), 11.92);
        Kit.plot(tl, seat5.querySelector('.s11-e42s'), 11.92, { dur: 0.06, steps: 2 });
        Kit.classAt(tl, seat5, 's11-live', 11.5);
        // #44 segment_start: the page turns on every screen, the new title plots
        tl.fromTo(sel('.s11-pg1', scr), { opacity: 1 }, { opacity: 0, duration: Kit.STEP, ease: 'steps(2)', immediateRender: false }, 12.71);
        Kit.plot(tl, sel('.s11-e44s', scr), 12.71, { dur: 0.24, steps: 4 });
        Kit.plot(tl, sel('.s11-e45s', scr), 13.28, { dur: 0.4, steps: 6 });

        // seq readouts
        scr4.forEach((s) => Kit.textAt(tl, s.querySelector('.s11-seq'), seqTimes));
        const s5seq = seat5.querySelector('.s11-seq');
        Kit.track(tl, 0, 16, (s) => {
          let v = '#0';
          if (s >= 11.5 && s < 11.98) v = '#' + Math.min(42, Math.floor((s - 11.5) / 0.48 * 42));
          else if (s >= 11.98) { v = '#42'; for (const [at, txt] of seqTimes) if (s >= at) v = txt; }
          s5seq.textContent = v;
        });
        // screens pulse in the same frame
        scr.forEach((el, si) => {
          Kit.track(tl, 9.0, 15.0, (s0) => {
            const s = s0 + 9.0;
            el.classList.toggle('s11-hit', scrPulse.some(([p, list]) => list.includes(si) && s >= p && s < p + 0.2));
          });
        });

        // track tabs flick in
        const tabs = [q('.s11-t1'), q('.s11-t2')];
        tabs.forEach((t, i) => {
          tl.set(t, { visibility: 'hidden' }, 0);
          tl.set(t, { visibility: 'visible' }, 13.43 + i * 0.14);
          tl.fromTo(t, { x: -520 }, { x: 0, duration: Kit.STEP, ease: 'steps(2)', immediateRender: false }, 13.43 + i * 0.14);
        });

        /* ================= FOLD (14.95) ================= */
        const F = 14.95;
        const rest = [...cards, ...scr, q('.s11-seatlabel'), q('.s11-writer'), q('.s11-stampwrap'), ...tabs];
        // exits keep each element's transform (no y jump): opacity steps, then hidden
        rest.forEach((el, i) => {
          tl.to(el, { opacity: 0, duration: 0.09, ease: 'steps(2)' }, F + i * 0.02);
        });
        tl.to(wire, { opacity: 0, duration: Kit.STEP, ease: 'steps(2)' }, F);
        // ledger to centre, then folds into the closed leaf
        tl.to(ledger, { x: 60, y: -26, duration: 0.45, ease: 'power3.inOut' }, F);
        tl.to(ledger, { x: 636.6 - 650, y: 296 - 120, width: 646.8, height: 336, duration: 0.2, ease: 'steps(4)' }, F + 0.67);
        // the cover prints over it
        const bookcam = q('.s11-bookcam');
        gsap.set(bookcam, { scale: 0.42 });
        const sheets = ['.s11-p1', '.s11-p2', '.s11-p3', '.s11-p4'].map(q);
        [20, 15, 10, 5].forEach((e, i) => gsap.set(sheets[i], { x: e, y: e }));
        Kit.stepIn(tl, q('.s11-book'), F + 0.87, { y: 0, scale: 1.02 });
        tl.set(ledger, { visibility: 'hidden' }, F + 0.96);

        tl.set({}, {}, 16);
        window.__timelines = window.__timelines || {};
        window.__timelines['s11-agents'] = tl;
      })();
    </script>
  </div>
</template>
