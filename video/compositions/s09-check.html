        const shape = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); e.setAttribute('class', a.class || 'stroke'); cr.boardSvg.appendChild(e); return e; };

        seg2.push(shape('line', { x1: 140, y1: 360, x2: 140, y2: 660 }), shape('line', { x1: 140, y1: 660, x2: 600, y2: 660 }));
        [[170, 380], [270, 520], [370, 590], [470, 625]].forEach(([x, y], i) => {

          const l = mk('div', 's09-axis-l', String(i + 1), cr.board); l.style.left = (x + 26) + 'px'; l.style.top = '672px'; seg2.push(l);
        });
        const yl = mk('div', 's09-axis-l', '%', cr.board); yl.style.left = '100px'; yl.style.top = '350px'; seg2.push(yl);

        // grouped question card in the rail (as s08 left it)
        const qc = mk('div', 'q-card attention s09-flycard',
          '<div class="q-head"><span class="stamp section" style="color: var(--h-orange)">დაჯგუფდა · 2 იკითხა</span><span class="plus1">+1</span></div>' +
          '<div class="q-title">რატომ ვერ აწერს PDA ხელს?</div>' +
          '<div class="q-askers">' +
            '<span class="who" style="--c:var(--p-gio)"><i></i>გიო</span><span class="s09-said">რატომ ვერ აწერს PDA ხელს ტრანზაქციას?</span>' +
            '<span class="who" style="--c:var(--p-mari)"><i></i>მარი</span><span class="s09-said">PDA თავად რატომ ვერ მოაწერს ხელს?</span>' +
          '</div>' +
          '<div class="s09-note">მასწავლებელი ამას მთელ კლასს უპასუხებს</div>', cr.railList);

        // ---- check card
        const card = mk('div', 'acetate s09-card',
          '<div class="s09-chead"><span class="stamp section">შემოწმება <span class="mono">1</span></span>' +
          '<span class="s09-tally">პასუხი <span class="mono s09-tn">0/4</span></span></div>' +
          '<div class="s09-prompt">ვის შეუძლია PDA-ს ხელის მოწერა?</div>' +
          '<div class="s09-opts">' +
          ['საფულის მფლობელს', 'პროგრამას', 'ნებისმიერს', 'არავის'].map((t, i) =>
            '<div class="option s09-opt s09-o' + i + '"><span class="key">' + 'ABCD'[i] + '</span>' + t + '<div class="s09-dots"></div>' +
            '<div class="s09-res"><div class="s09-track"><div class="s09-fill s09-f' + i + '"></div></div><span class="mono">' + [1, 3, 0, 0][i] + '</span></div></div>').join('') +
          '</div>' +
          '<div class="s09-hl"><span class="mono">4</span>-დან <span class="mono">3</span> მიხვდა</div>' +
          '<div class="s09-explain">პასუხი: B. ხელს მხოლოდ პროგრამა აწერს.</div>', q('.s09-over'));
        card.setAttribute('data-layout-allow-occlusion', '');
        card.setAttribute('data-layout-allow-overflow', '');
        const opts = qa('.s09-opt');
        const opts_ = () => opts;
        const dot = (who, letter, arrow) => {
          const d = document.createElement('span');
          d.className = 's09-dot ' + who;
          d.innerHTML = letter + (arrow ? '<span class="s09-arr">' + ic('arrow-up-right') + '</span>' : '');
          return d;

        const dA = dot('ana', 'ა'), dG = dot('gio', 'გ'), dN = dot('nika', 'ნ', true), dM = dot('mari', 'მ');
        opts[1].querySelector('.s09-dots').append(dA, dG, dN);
        opts[0].querySelector('.s09-dots').append(dM);
        q('.s09-f0').style.cssText += 'width:25%;background:var(--section)';
        q('.s09-f1').style.cssText += 'width:75%;background:var(--ok)';

        // ---- ready strip
        const strip = mk('div', 's09-strip',
          '<div class="s09-rl">მზად:</div>' +
          '<div class="s09-person s09-pa"><span class="punch sm ana">ა<span class="mark s09-ok s09-ka">' + ic('check') + '</span></span>ანა</div>' +
          '<div class="s09-person s09-pg"><span class="punch sm gio">გ<span class="mark s09-ok s09-kg">' + ic('check') + '</span></span>გიო</div>' +
          '<div class="s09-person s09-pm"><span class="punch sm mari">მ<span class="mark s09-ok s09-km">' + ic('check') + '</span></span>მარი</div>' +

        const bdiv = (cls, html) => mk('div', cls, html, cr.board);
        const qaTitle = bdiv('fig-title s09-banner', 'კითხვა-პასუხი: რატომ ვერ აწერს PDA ხელს?');
        const qaNote = bdiv('fig-note s09-qa-note', 'რატომ ვერ აწერს<br>PDA ხელს?');
        const qaArrow = [shape('path', { d: 'M 530 335 H 790' }), shape('path', { d: 'M 768 321 L 791 335 L 768 349' })];
        const qaBox = shape('rect', { x: 800, y: 230, width: 620, height: 210 });
        const qaText = bdiv('fig-box s09-ans', '<div class="s09-a1">პირადი გასაღები არ არსებობს</div><div class="s09-a2">→ მხოლოდ პროგრამას შეუძლია</div><div class="s09-a3">ხელის მოწერა (invoke_signed)</div>');
        const qaCredit = bdiv('s09-credit', 'იკითხეს: გიომ და მარიმ');

        allowUnder(cr.host);
        card.setAttribute('data-layout-allow-overlap', '');

        /* ================= timeline ================= */
        // V1: the room at 0.9565x with the ready strip at the bottom of the safe area
        const V1 = { scale: 0.9565, x: 80, y: 885 - 1240 * 0.9565 };

        // cursors
        const ana = Kit.makeCursor(S.root, 'ana', 'ანა', { x: 420, y: 760 });
        const gio = Kit.makeCursor(S.root, 'gio', 'გიო', { x: 1180, y: 760 });

        const curs = [ana, gio, mari];
        tl.set(curs, { visibility: 'hidden' }, 0);
        tl.set(curs, { visibility: 'visible' }, 0.6);
        const pB = { x: 1150, y: 404 }, pA = { x: 560, y: 404 };
        Kit.cursorMove(tl, ana, 0.55, pB.x - 40, pB.y + 10, { dur: 0.6 });
        Kit.cursorMove(tl, gio, 0.95, pB.x + 60, pB.y + 22, { dur: 0.7 });
        Kit.cursorMove(tl, mari, 1.45, pA.x + 20, pA.y + 14, { dur: 0.8 });
        Kit.cursorClick(tl, ana, 1.17);
        Kit.cursorClick(tl, gio, 1.75);
        Kit.cursorClick(tl, mari, 2.33);
        Kit.stepIn(tl, dA, 1.2, { y: 0, scale: 0.6 });
        Kit.stepIn(tl, dG, 1.78, { y: 0, scale: 0.6 });
        Kit.stepIn(tl, dM, 2.36, { y: 0, scale: 0.6 });
        Kit.stamp(tl, dN, 2.92, { from: 1.3 });
        Kit.textAt(tl, q('.s09-tn'), [[0, '0/4'], [1.2, '1/4'], [1.78, '2/4'], [2.36, '3/4'], [2.92, '4/4']]);

        Kit.classAt(tl, opts[0], 'wrong', 3.5);

        Kit.stamp(tl, q('.s09-hl'), 4.08, { from: 1.1 });
        Kit.stepIn(tl, q('.s09-explain'), 4.3, { x: -10, y: 0 });

        Kit.cursorMove(tl, ana, 3.7, scr(1675, 1190).x - 30, scr(1675, 1190).y - 6, { dur: 0.8 });
        Kit.cursorMove(tl, gio, 3.9, scr(560, 1215).x, scr(560, 1215).y, { dur: 0.9 });
        Kit.cursorMove(tl, mari, 4.1, scr(1000, 1215).x, scr(1000, 1215).y, { dur: 0.9 });

        // 4.67 ready gate, one per beat
        Kit.cursorClick(tl, ana, 4.67, { press: q('.s09-rb'), hold: null });
        Kit.stamp(tl, q('.s09-ka'), 4.72, { from: 1.4 });
        Kit.stamp(tl, q('.s09-kg'), 5.25, { from: 1.4 });
        Kit.stamp(tl, q('.s09-km'), 5.83, { from: 1.4 });

        tl.set(q('.s09-pn .s09-nl'), { visibility: 'visible' }, 6.42);
