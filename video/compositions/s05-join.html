  leaf settles to the board's rect; last frame = a blank board leaf on paper at screen

  Local timeline (film = 40 + local); beats every 0.571 s, bars at 1.43, 3.71, 6.0, 8.29:
    0.10 title page blurs out, punches leave      0.30 lobby blurs in (room, invite code)
    0.86 QR plots on                              1.43 seats "0/5" stamps

    2.60 name types "მარი"                        3.14 მარი taps "შესვლა"

    6.00 phone slides out, camera to the button   6.29 "გაკვეთილის დაწყება" lands (yellow)
    7.14 ანა presses it (ink, yellow type)
    7.71 lobby clears, tabs tuck in, page edges square up
    8.00-9.40 camera pushes in, the leaf becomes the board     8.86 "გვერდი 1"

    <script>
      (function () {
        const S = Kit.scope('s05-join');
        const q = S.q, qa = S.qa;
        const tl = gsap.timeline({ paused: true });
        Kit.hydrateIcons(S.root);

        const camera = q('.s05-camera');
        const sheets = ['.s05-p1', '.s05-p2', '.s05-p3', '.s05-p4'].map(q);
        const EDGES = [20, 15, 10, 5];
        const tabs = qa('.s05-tabs .tab');
        const page = q('.s05-page');
        sheets.forEach((s, i) => gsap.set(s, { x: EDGES[i], y: EDGES[i] }));
        gsap.set(camera, { scale: 1, x: 0, y: 0 });

        // screen position of a page-local point under a camera state (origin 960,464)
        const scr = (px, py, c) => ({ x: 960 + (190 + px - 960) * c.scale + c.x, y: 464 + (64 + py - 464) * c.scale + c.y });

        // ---- QR modules (decorative, deterministic)
        (function buildQR() {
          const N = 25, M = 12, r = Kit.rng(4242);
          let d = '';
          const finder = (cx, cy, x, y) => {
            const dx = x - cx, dy = y - cy;
            if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
            if (dx === 0 || dy === 0 || dx === 6 || dy === 6) return true;
            if (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4) return true;
            return false;
          };
          for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
            let on = null;
            for (const [cx, cy] of [[0, 0], [18, 0], [0, 18]]) { const f = finder(cx, cy, x, y); if (f !== null) on = f; }
            if (on === null) {
              const nearFinder = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
              on = !nearFinder && r() < 0.48;
            }
            if (on) d += 'M' + x * M + ' ' + y * M + 'h' + M + 'v' + M + 'h-' + M + 'z';
          }
          q('.s05-mods').setAttribute('d', d);
        })();

        // ---- 0.10 the title page blurs out; the punches leave (the room starts empty)
        const tp = q('.s05-tp');
        tl.fromTo(tp, { filter: 'blur(0px)', opacity: 1 }, { filter: 'blur(12px)', opacity: 0, duration: 0.2, ease: 'steps(3)', immediateRender: false }, 0.1);
        tl.set(tp, { visibility: 'hidden' }, 0.3);
        Kit.stepOut(tl, qa('.s05-who'), 0.1, { y: 0, stagger: 0.04 });
        Kit.textAt(tl, q('.s05-folio'), [[0, '01'], [0.3, '02']]);

        // ---- 0.30 the lobby blurs in
        const lobby = q('.s05-lobby');
        tl.set(lobby, { visibility: 'hidden' }, 0);
        tl.set(lobby, { visibility: 'visible' }, 0.3);
        tl.fromTo(lobby, { filter: 'blur(12px)', opacity: 0.2 }, { filter: 'blur(0px)', opacity: 1, duration: 0.24, ease: 'steps(3)', immediateRender: false }, 0.3);

        // ---- 0.86 QR plots on (frame stroke + modules printing down in 8 steps)
        Kit.plot(tl, q('.s05-qr-frame'), 0.86, { dur: 0.5 });
        const mods = q('.s05-mods');
        tl.set(mods, { visibility: 'hidden' }, 0);
        tl.set(mods, { visibility: 'visible' }, 0.95);
        tl.fromTo(mods, { clipPath: 'inset(0% 0% 100% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.64, ease: 'steps(8)', immediateRender: false }, 0.95);
        Kit.stepIn(tl, q('.s05-qr-lab'), 1.5);

        // ---- 1.43 seats
        Kit.stepIn(tl, q('.s05-seats-lab'), 1.43);
        Kit.stamp(tl, q('.s05-seats'), 1.43, { from: 1.18 });

        // camera eases toward the code while the room waits
        const C1 = { scale: 1.05, x: -24, y: 6 };
        Kit.camera(tl, camera, 0.9, C1, { dur: 1.2 });

        // ---- 2.00 მარი's phone slides in from the right
        const phone = q('.s05-phone');
        gsap.set(phone, { x: 560, rotation: 4 });   // waits off frame (right)
        tl.fromTo(phone, { x: 560, rotation: 4 }, { x: 0, rotation: 0, duration: 0.6, ease: 'expo.out', immediateRender: false }, 2.0);
        Kit.stamp(tl, q('.s05-ph-chip'), 2.57, { from: 1.2 });
        Kit.typeText(tl, q('.s05-ph-input'), 'მარი', 2.6, { cps: 18, caretUntil: 3.1 });

        const mari = Kit.makeCursor(S.root, 'mari', 'მარი', { x: 1990, y: 760 });
        Kit.cursorMove(tl, mari, 2.4, 1640, 600, { dur: 0.7 });
        Kit.cursorClick(tl, mari, 3.143, { press: q('.s05-ph-btn'), hold: 0.2 });
        // phone swaps to "in the room"
        Kit.stepOut(tl, q('.s05-ph-form'), 3.35);
        Kit.stepIn(tl, q('.s05-ph-in'), 3.42);
        Kit.cursorMove(tl, mari, 3.5, 1990, 700, { dur: 0.6 });

        // ---- the joins, one per beat
        const JOIN = [3.714, 4.286, 4.857, 5.429];
        const ins = qa('.s05-in');
        const rows = qa('.s05-row');
        const dots = qa('.s05-ph-dots b');
        Kit.stepIn(tl, q('.s05-roster-lab'), JOIN[0]);
        JOIN.forEach((t, i) => {
          Kit.stepIn(tl, ins[i], t, { y: 0, scale: 0.7 });
          Kit.stepIn(tl, rows[i], t, { x: -12, y: 0 });
          Kit.stepIn(tl, dots[i], t, { y: 0, scale: 0.6 });
        });
        Kit.stepIn(tl, ins[4], 5.6, { y: 0, scale: 0.8 });
        const seatTimes = [[0, '0/5']].concat(JOIN.map((t, i) => [t, (i + 1) + '/5']));
        Kit.textAt(tl, q('.s05-seats'), seatTimes);
        Kit.textAt(tl, q('.s05-ph-count'), seatTimes);

        // ---- 6.00 the phone leaves; the host starts the class
        tl.to(phone, { x: 600, duration: 0.4, ease: 'power3.in' }, 6.0);
        const C2 = { scale: 1.08, x: -60, y: -36 };
        Kit.camera(tl, camera, 6.0, C2, { dur: 1.0 });
        Kit.stamp(tl, q('.s05-start'), 6.29, { from: 1.15 });

        const btnAt = scr(990 + 220, 664 + 44, C2);
        const ana = Kit.makeCursor(S.root, 'ana', 'ანა', { x: 1990, y: 860 });
        Kit.cursorMove(tl, ana, 6.3, btnAt.x + 30, btnAt.y + 12, { dur: 0.75 });
        Kit.cursorClick(tl, ana, 7.143, { press: q('.s05-start'), hold: null });
        Kit.cursorMove(tl, ana, 7.5, 1990, 900, { dur: 0.5 });

        // ---- 7.71 the lobby clears; the book closes up around the leaf
        // exits use opacity on the container: children with their own visibility would survive a hidden parent
        const out = (els, t, o = {}) => tl.to(els, { opacity: 0, y: o.y ?? -6, duration: 0.066, ease: 'steps(2)', stagger: o.stagger ?? 0 }, t);
        out([q('.s05-head'), lobby], 7.714);
        out(qa('.s05-binding-in .s05-hole'), 7.714, { y: 0, stagger: 0.03 });
        out(qa('.s05-binding:not(.s05-binding-in) .s05-empty'), 7.85, { y: 0 });
        tabs.forEach((t, i) => tl.to(t, { x: -40, duration: Kit.STEP, ease: 'steps(2)' }, 7.714 + i * 0.05));
        sheets.forEach((s) => tl.to(s, { x: 0, y: 0, duration: 0.18, ease: 'steps(2)' }, 7.8));
        tl.set(sheets.concat(tabs), { visibility: 'hidden' }, 8.0);

        // ---- 8.00 push in: the leaf becomes the board (screen 100,47 1720x834.3 at the end)
        const K = 1.3;
