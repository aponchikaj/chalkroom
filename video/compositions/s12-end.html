<!--

  Handoff IN (from s11): the closed cover of the s04 book at camera scale 0.42
  (647 x 336 on screen, centred at 960, 464), four page edges squared 5/10/15/20 px.

  Beats (105 BPM, 0.571 s; bars at 0, 2.29, 4.57, 6.86; final chord at local 8.0).
  Local timeline (film = 138 + local):
    0.29 cover hinges open, camera pushes in to 1 (to 1.55)
    0.70 running head    1.14 "ეს არ არის ჩატბოტი / ვიდეოს გვერდით." prints
    2.40 an ink rule strikes it through      2.86 stepped swap: "ეს თავად კლასია."
    4.57 stepped swap: "კლასი არასდროს ელოდება / ერთ ადამიანს."
    5.71 / 6.00 / 6.29 ready marks on ანა, გიო, მარი; 6.57 ნიკა's thread mark
    8.00 final card: "Chalkroom Live" prints, 8.40 rule, 8.75 "ვისწავლოთ ერთად."
    8.90 six tabs flick out (0.13 s apart)   9.70 footer
    8.0-11.0 slow camera settle; 11.0-12.0 the frame holds still.
  Everything important stays above y = 864 (the page bottom), clear of the subtitle band.
-->
<template id="s12-end-template">

      .s12-page { position: absolute; inset: 0; background: var(--leaf); border: 1.5px solid var(--leaf-edge);

      .s12-head { position: absolute; left: 150px; right: 110px; top: 40px; height: 64px; display: flex; align-items: center;

      .s12-head .s12-folio { font-family: var(--f-mono); font-size: 28px; color: var(--ink-3); }

      .s12-say { position: absolute; left: 150px; top: 170px; white-space: nowrap;

      .s12-say div { position: relative; width: max-content; }
      .s12-say.s12-c { font-size: 98px; top: 200px; line-height: 1.2; }
      .s12-strike { position: absolute; left: 140px; top: 170px; width: 1300px; height: 300px; overflow: visible; }
      .s12-big { position: absolute; left: 142px; top: 240px; white-space: nowrap;
        font-family: var(--f-head); font-size: 158px; font-weight: 850; font-stretch: 75%; line-height: 0.95; letter-spacing: -0.02em; color: var(--ink); }

      /* final card (same type as s04) */
      .s12-title { position: absolute; left: 142px; top: 150px; white-space: nowrap;
        font-family: var(--f-head); font-size: 196px; font-weight: 850; font-stretch: 75%; line-height: 0.9; letter-spacing: -0.02em; color: var(--ink); }
      .s12-rule { position: absolute; left: 150px; top: 356px; width: 1280px; height: 8px; overflow: visible; }
      .s12-tag { position: absolute; left: 150px; top: 400px; white-space: nowrap;
        font-family: var(--f-head); font-size: 104px; font-weight: 800; font-stretch: 75%; line-height: 1.2; color: var(--ink); }
      .s12-footrule { position: absolute; left: 150px; right: 110px; top: 676px; height: 1.5px; background: var(--ink); }
      .s12-foot { position: absolute; left: 150px; top: 700px; white-space: nowrap;
        font-family: var(--f-head); font-size: 32px; font-weight: 720; font-stretch: 80%; letter-spacing: 0.05em; color: var(--ink-2); }
      .s12-foot .s12-sep { color: var(--ink-3); padding: 0 10px; }

      .s12-binding { position: absolute; left: 37px; top: 150px; display: flex; flex-direction: column; gap: 46px; }
      .s12-hole { position: relative; width: 76px; height: 76px; }
      .s12-hole .s12-empty { position: absolute; inset: 14px; border-radius: 50%; background: var(--paper-3); box-shadow: var(--shadow-punch); }
      .s12-hole .punch { position: absolute; left: 0; top: 0; }
      .s12-hole .punch .mark.s12-ok { background: var(--ok); }

      .s12-cover { position: absolute; inset: 0; background: var(--paper-2); border: 1.5px solid var(--rule-2);
        border-radius: var(--r-leaf); box-shadow: var(--shadow-leaf); backface-visibility: hidden; }
      .s12-cover .s12-frame { position: absolute; inset: 40px 40px 40px 130px; border: 3px solid var(--ink); }
      .s12-cover .s12-frame::after { content: ''; position: absolute; inset: 10px; border: 1.5px solid var(--ink); }
      .s12-cover .s12-cb { position: absolute; left: 130px; right: 40px; top: 300px; text-align: center;
        font-family: var(--f-head); font-size: 112px; font-weight: 800; font-stretch: 75%; letter-spacing: 0.16em; color: var(--ink); }
      .s12-cover .s12-cr { position: absolute; left: 50%; margin-left: -150px; width: 300px; top: 470px; height: 3px; background: var(--ink); transform: translateX(45px); }
    </style>

    <div id="s12-end-bg" class="paper-bg clip" data-start="0" data-duration="12" data-track-index="0"></div>

    <div class="s12-camera">
      <div class="s12-book">
        <div class="s12-tabs" data-layout-allow-overflow>
          <div class="tab stub orange"></div><div class="tab stub teal"></div><div class="tab stub grass"></div>
          <div class="tab stub ultra"></div><div class="tab stub violet"></div><div class="tab stub sienna"></div>
        </div>
        <div class="s12-sheet s12-p1"></div><div class="s12-sheet s12-p2"></div><div class="s12-sheet s12-p3"></div><div class="s12-sheet s12-p4"></div>

        <div class="s12-page">
          <div class="s12-head"><span class="s12-brand">CHALKROOM LIVE</span><span class="s12-folio">12</span></div>
          <div class="s12-binding">
            <div class="s12-hole"><div class="s12-empty"></div><div class="punch ana"><span class="host">H</span>ა<span class="mark s12-ok s12-m1"><i data-icon="check"></i></span></div></div>
            <div class="s12-hole"><div class="s12-empty"></div><div class="punch nika">ნ<span class="mark s12-m4"><i data-icon="arrow-up-right"></i></span></div></div>
            <div class="s12-hole"><div class="s12-empty"></div><div class="punch gio">გ<span class="mark s12-ok s12-m2"><i data-icon="check"></i></span></div></div>
            <div class="s12-hole"><div class="s12-empty"></div><div class="punch mari">მ<span class="mark s12-ok s12-m3"><i data-icon="check"></i></span></div></div>
            <div class="s12-hole"><div class="s12-empty"></div><div class="punch open"></div></div>
          </div>

          <div class="s12-say s12-a"><div class="s12-a1">ეს არ არის ჩატბოტი</div><div class="s12-a2">ვიდეოს გვერდით.</div></div>
          <svg class="s12-strike" viewBox="0 0 1300 300">
            <line class="stroke s12-st1" x1="4" y1="76" x2="1010" y2="76" style="stroke-width: 9" />
            <line class="stroke s12-st2" x1="4" y1="206" x2="860" y2="206" style="stroke-width: 9" />
          </svg>
          <div class="s12-big s12-b">ეს თავად კლასია.</div>
          <div class="s12-say s12-c"><div class="s12-c1">კლასი არასდროს ელოდება</div><div class="s12-c2">ერთ ადამიანს.</div></div>

          <div class="s12-title">Chalkroom Live</div>
          <svg class="s12-rule" viewBox="0 0 1280 8"><line class="stroke s12-rule-line" x1="2" y1="4" x2="1278" y2="4" style="stroke-width: 3" /></svg>
          <div class="s12-tag">ვისწავლოთ ერთად.</div>
          <div class="s12-footrule"></div>
          <div class="s12-foot">Hacktoberfest Georgia 2026<span class="s12-sep">·</span>კოტე ბიბილაური<span class="s12-sep">·</span>ლაზარე მირზიაშვილი</div>
        </div>

        <div class="s12-cover" data-layout-allow-occlusion>
          <div class="s12-frame"></div>
          <div class="s12-binding">
            <div class="s12-hole"><div class="s12-empty"></div></div><div class="s12-hole"><div class="s12-empty"></div></div>
            <div class="s12-hole"><div class="s12-empty"></div></div><div class="s12-hole"><div class="s12-empty"></div></div>
            <div class="s12-hole"><div class="s12-empty"></div></div>
          </div>
          <div class="s12-cb">CHALKROOM</div>
          <div class="s12-cr"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const S = Kit.scope('s12-end');
        const q = S.q, qa = S.qa;
        Kit.hydrateIcons(S.root);
        // the title page lies under the cover while it opens: intentional layering
        [q('.s12-page'), ...q('.s12-page').querySelectorAll('*')].forEach((e) => e.setAttribute('data-layout-allow-occlusion', ''));
        const tl = gsap.timeline({ paused: true });
        const camera = q('.s12-camera');
        const cover = q('.s12-cover');
        const tabs = qa('.s12-tabs .tab');

        // ---- 0.00 handoff in: the closed cover at camera 0.42 (s11's last frame)
        gsap.set(camera, { scale: 0.42 });
        ['.s12-p1', '.s12-p2', '.s12-p3', '.s12-p4'].map(q).forEach((s, i) => gsap.set(s, { x: [20, 15, 10, 5][i], y: [20, 15, 10, 5][i] }));
        gsap.set(tabs, { x: -34 });

        // ---- 0.29 the cover hinges open, camera pushes in
        tl.fromTo(cover,
          { rotationY: 0, transformPerspective: 2600, transformOrigin: '0% 50%' },
          { rotationY: -100, duration: 0.54, ease: 'steps(6)', immediateRender: false }, 0.29);
        tl.set(cover, { visibility: 'hidden' }, 0.83);
        Kit.camera(tl, camera, 0.25, { scale: 1 }, { dur: 1.3, ease: 'power3.inOut' });
        Kit.stepIn(tl, q('.s12-head'), 0.7);

        // printed line: clip reveal left to right in steps (like the s04 title)
        const print = (el, t, dur = 0.36, steps = 6) => {
          tl.set(el, { visibility: 'hidden' }, 0);
          tl.set(el, { visibility: 'visible' }, t);
          tl.fromTo(el, { clipPath: 'inset(-10% 100% -20% 0%)', y: 6 },
            { clipPath: 'inset(-10% 0% -20% 0%)', y: 0, duration: dur, ease: 'steps(' + steps + ')', immediateRender: false }, t);
        };
        const out = (els, t) => {
          tl.to(els, { opacity: 0, y: -6, duration: 0.066, ease: 'steps(2)' }, t);
          tl.set(els, { visibility: 'hidden' }, t + 0.066);
        };

        // ---- 1.14 "ეს არ არის ჩატბოტი ვიდეოს გვერდით."
        print(q('.s12-a1'), 1.14);
        print(q('.s12-a2'), 1.6);
        // 2.40 struck through, 2.86 swapped
        Kit.plot(tl, [q('.s12-st1'), q('.s12-st2')], 2.4, { dur: 0.3, steps: 6, stagger: 0.1 });
        out([q('.s12-a'), q('.s12-strike')], 2.86);
        Kit.stepIn(tl, q('.s12-b'), 2.95, { x: -12, y: 0, scale: 1.03 });

        // ---- 4.57 the principle
        out(q('.s12-b'), 4.57);
        print(q('.s12-c1'), 4.66, 0.42, 7);
        print(q('.s12-c2'), 5.14, 0.3, 5);
        // the class keeps moving: ready marks, ნიკა in a thread
        Kit.stepIn(tl, [q('.s12-m1'), q('.s12-m2'), q('.s12-m3')], 5.71, { y: 0, scale: 0.6, stagger: 0.29 });
        Kit.stepIn(tl, q('.s12-m4'), 6.57, { y: 0, scale: 0.6 });

        // ---- 8.00 final card
        out([q('.s12-c'), q('.s12-m1'), q('.s12-m2'), q('.s12-m3'), q('.s12-m4')], 7.86);
        print(q('.s12-title'), 8.0, 0.42, 7);
        Kit.plot(tl, q('.s12-rule-line'), 8.4, { dur: 0.48 });
        Kit.stepIn(tl, q('.s12-tag'), 8.75, { x: -10, y: 0 });
        tabs.forEach((t, i) => {
          tl.fromTo(t, { x: -34 }, { x: 0, duration: Kit.STEP, ease: 'steps(2)', immediateRender: false }, 8.9 + i * 0.13);
        });
        Kit.stepIn(tl, q('.s12-footrule'), 9.6, { y: 0 });
        Kit.stepIn(tl, q('.s12-foot'), 9.7, { y: 6 });
        // slow settle, then the last second holds perfectly still
        Kit.camera(tl, camera, 8.0, { scale: 1.02 }, { dur: 3.0, ease: 'power2.out' });

        tl.set({}, {}, 12);
        window.__timelines = window.__timelines || {};
        window.__timelines['s12-end'] = tl;
      })();
    </script>
  </div>
</template>
