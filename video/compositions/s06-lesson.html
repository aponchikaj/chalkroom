<!--
  s06-lesson (film 50-64 s, 14 s): the lesson draws in sync.

  Handoff IN (from s05): a blank board leaf on paper at screen (100, 47) 1720 x 834,
  page number "გვერდი 1". That is the shell's board at camera {scale 1.116883, x -145.714,
  y -165.208}; the rest of the room is hidden and assembles during the pull-back.
  Handoff OUT (to s07): camera view `full` of the classroom shell (CONVENTIONS.md 13),
  finished PDA page, caption, rail with tabs and empty list, ask bar with placeholder.

  The room lives in ანა's laptop screen (world 0,0 1920x1080). The world wrapper pulls
  back to show three laptops and a phone (ნიკა, გიო, მარი) plotting the same strokes on
  the same frame (one timeline drives all four boards), then pushes back in.

  Local timeline (film = 50 + local), beats every 0.583 s, bars at 0, 2.33, 4.67, 7, 9.33, 11.67:
    0.12 title prints        0.58 wallet box plots
    1.17 camera pulls back to the room, UI assembles (masthead, binding, rail, tabs, bar)
    1.75 program box plots   2.33 phase stamp "ასწავლის"   2.92 arrow + "seeds + bump"
    3.50 PDA circle plots    4.08 circle fill
    4.67 world pulls back: four devices   5.40 device name tags
    5.83 formula prints on all four        6.42 sticky note on all four
    7.00 push back into ანა's screen, onto the lesson (board + caption fitted to the safe area)
    8.17 caption writes word by word (to 10.4)
    9.33 chip "1 მიხვდა"     10.50 chip "2 დაბნეული"
    11.08 camera to the `full` view (end frame), holds from 12.3
-->
<template id="s06-lesson-template">
  <div data-composition-id="s06-lesson" data-width="1920" data-height="1080" data-duration="14">
    <link rel="stylesheet" href="../assets/chalk.css" />
    <link rel="stylesheet" href="../assets/classroom.css" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <script src="../assets/kit.js"></script>
    <script src="../assets/classroom.js"></script>
    <style>
      .s06-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      .s06-dev { position: absolute; }
      .s06-bezel {
        position: absolute; background: var(--leaf); border: 7px solid var(--ink); border-radius: 34px;
        box-shadow: 0 6px 0 var(--rule), 0 70px 120px -70px rgba(60, 45, 15, 0.5);
      }
      .s06-laptop .s06-bezel { left: -44px; top: -44px; width: 2008px; height: 1184px; }
      .s06-base {
        position: absolute; left: -190px; top: 1140px; width: 2300px; height: 64px; background: var(--paper-2);
        border: 7px solid var(--ink); border-radius: 6px 6px 40px 40px;
      }
      .s06-base::after { content: ''; position: absolute; left: 50%; top: -7px; width: 300px; margin-left: -150px; height: 22px; border: 7px solid var(--ink); border-top: none; border-radius: 0 0 18px 18px; background: var(--paper-3); }
      .s06-screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      .s06-phone .s06-bezel { left: -36px; top: -36px; width: 772px; height: 1572px; border-radius: 96px; }
      .s06-phone .s06-screen { width: 700px; height: 1500px; border-radius: 64px; }
      .s06-notch { position: absolute; left: 270px; top: 18px; width: 160px; height: 34px; border-radius: 17px; background: var(--ink); }
      .s06-tag {
        position: absolute; display: flex; align-items: center; gap: 40px; white-space: nowrap;
        font-family: var(--f-head); font-size: 112px; font-weight: 800; font-stretch: 78%; color: var(--ink);
      }
      .s06-tag i { display: block; width: 110px; height: 110px; border-radius: 50%; background: var(--paper-3); box-shadow: 0 0 0 16px var(--who); }
      .s06-tag .s06-dev-kind { font-weight: 500; color: var(--ink-3); font-size: 84px; }

      /* phone layout */
      .s06-ph-head { position: absolute; left: 36px; right: 36px; top: 80px; border-bottom: 2.5px solid var(--ink); padding-bottom: 18px; }
      .s06-ph-brand { font-family: var(--f-head); font-size: 22px; font-weight: 800; font-stretch: 75%; letter-spacing: 0.16em; color: var(--ink); }
      .s06-ph-title { font-family: var(--f-head); font-size: 50px; font-weight: 800; font-stretch: 78%; color: var(--ink); margin-top: 6px; }
      .s06-ph-seg { font-family: var(--f-head); font-size: 26px; color: var(--ink-2); margin-top: 4px; }
      .s06-ph-head .stamp { position: absolute; right: 0; top: 0; height: 40px; font-size: 24px; color: var(--h-orange); }
      .s06-ph-boardwrap { position: absolute; left: 20px; top: 300px; width: 1540px; height: 747px; transform: scale(0.428571); transform-origin: 0 0; }
      .s06-ph-boardwrap .board { left: 0; top: 0; width: 1540px; height: 747px; }
      .s06-ph-cap { position: absolute; left: 30px; right: 30px; top: 650px; border-top: 1.5px solid var(--rule); padding-top: 18px; text-align: center; font-family: var(--f-read); font-size: 30px; line-height: 1.4; color: var(--ink); }
      .s06-ph-people { position: absolute; left: 36px; top: 800px; display: flex; gap: 26px; }
      .s06-ph-people .punch { width: 64px; height: 64px; font-size: 28px; }
      .s06-ph-ask { position: absolute; left: 30px; right: 30px; top: 1360px; display: flex; gap: 14px; }
      .s06-ph-ask .input { flex: 1; height: 72px; font-size: 26px; }
      .s06-ph-ask .btn { height: 72px; font-size: 26px; padding: 0 18px; color: var(--ink-3); border-color: var(--rule-2); }
      .s06-cap-w { visibility: hidden; }
    </style>

    <div id="s06-lesson-bg" class="paper-bg clip" data-start="0" data-duration="14" data-track-index="0"></div>

    <div class="s06-world" data-layout-allow-overflow>
      <!-- ნიკა's laptop -->
      <div class="s06-dev s06-laptop s06-dev-b" style="left:-2500px; top:0px">
        <div class="s06-bezel"></div><div class="s06-screen"></div><div class="s06-base"></div>
        <div class="s06-tag" style="--who: var(--p-nika); left: 640px; top: 1250px"><i></i>ნიკა <span class="s06-dev-kind">ლეპტოპი</span></div>
      </div>
      <!-- გიო's laptop -->
      <div class="s06-dev s06-laptop s06-dev-c" style="left:-1786px; top:1768px">
        <div class="s06-bezel"></div><div class="s06-screen"></div><div class="s06-base"></div>
        <div class="s06-tag" style="--who: var(--p-gio); left: 660px; top: 1250px"><i></i>გიო <span class="s06-dev-kind">ლეპტოპი</span></div>
      </div>
      <!-- მარი's phone -->
      <div class="s06-dev s06-phone s06-dev-d" style="left:660px; top:1436px">
        <div class="s06-bezel"></div>
        <div class="s06-screen">
          <div class="s06-ph-head">
            <div class="s06-ph-brand">CHALKROOM LIVE</div>
            <div class="s06-ph-title">Solana PDA-ები</div>
            <div class="s06-ph-seg">ნაწილი 1 / 3</div>
            <span class="stamp section">ასწავლის</span>
          </div>
          <div class="s06-ph-boardwrap"><div class="board s06-ph-board"><div class="page-no">გვერდი 1</div><svg class="s06-ph-svg" viewBox="0 0 1540 747"></svg></div></div>
          <div class="s06-ph-cap">&nbsp;</div>
          <div class="s06-ph-people">
            <div class="punch ana sm">ა</div><div class="punch nika sm">ნ</div><div class="punch gio sm">გ</div><div class="punch mari sm">მ</div><div class="punch open sm"></div>
          </div>
          <div class="s06-ph-ask"><div class="input"><span class="placeholder">იკითხე...</span></div><span class="btn">კითხვა</span></div>
          <div class="s06-notch"></div>
        </div>
        <div class="s06-tag" style="--who: var(--p-mari); left: 20px; top: 1580px"><i></i>მარი <span class="s06-dev-kind">ტელეფონი</span></div>
      </div>
      <!-- ანა's laptop: its screen is the film frame at rest -->
      <div class="s06-dev s06-laptop s06-dev-a" style="left:0px; top:0px">
        <div class="s06-bezel"></div><div class="s06-screen"></div><div class="s06-base"></div>
        <div class="s06-tag" style="--who: var(--p-ana); left: 680px; top: 1250px"><i></i>ანა <span class="s06-dev-kind">ჰოსტი</span></div>
      </div>
    </div>

    <script>
      (function () {
        const S = Kit.scope('s06-lesson');
        const q = S.q, qa = S.qa;
        const tl = gsap.timeline({ paused: true });
        const world = q('.s06-world');

        const CAPTION = 'შედეგი მრუდის გარეთაა, ამიტომ პირადი გასაღები მას არ აქვს.';
        const START = { scale: 1.116883, x: 100 - 220 * 1.116883, y: 47 - 190 * 1.116883 };

        // ---- the four rooms
        const crA = Kit.classroom(q('.s06-dev-a .s06-screen'), { view: START, tabTimes: { orange: '0:18', teal: '~3წთ', grass: '~3წთ' } });
        const crB = Kit.classroom(q('.s06-dev-b .s06-screen'), { view: 'device', tabTimes: { orange: '0:18', teal: '~3წთ', grass: '~3წთ' } });
        const crC = Kit.classroom(q('.s06-dev-c .s06-screen'), { view: 'device', tabTimes: { orange: '0:18', teal: '~3წთ', grass: '~3წთ' } });
        const rooms = [crA, crB, crC];
        const boards = rooms.map((cr) => Kit.classroom.pdaBoard(cr.board, cr.boardSvg));
        boards.push(Kit.classroom.pdaBoard(q('.s06-ph-board'), q('.s06-ph-svg')));
        const all = (k) => boards.map((b) => b[k]).flat();

        // captions: one span per word, revealed in sync on all four
        const caps = rooms.map((cr) => cr.caption).concat([q('.s06-ph-cap')]);
        const words = CAPTION.split(' ');
        const capSpans = caps.map((c) => {
          c.innerHTML = words.map((w) => '<span class="s06-cap-w">' + Kit.esc(w) + '</span>').join(' ');
          return Array.from(c.querySelectorAll('.s06-cap-w'));
        });
        Kit.track(tl, 8.17, 10.4, (s, p) => {
          const n = Math.ceil(p * words.length - 1e-6);
          capSpans.forEach((sp) => sp.forEach((w, i) => { w.style.visibility = i < n ? 'visible' : 'hidden'; }));
        });

        // the segment clock ticks on every screen (secondary motion all scene)
        const clocks = rooms.map((cr) => cr.tabs.orange.time);
        Kit.track(tl, 0, 14, (s) => {
          const v = '0:' + String(18 + Math.min(14, Math.floor(s + 1e-6)));
          clocks.forEach((c) => { c.textContent = v; });
        });

        // ---- printed text: clip reveal in steps(8) (title, formula), like the plotter
        const printOn = (els, t, dur) => {
          tl.set(els, { visibility: 'hidden' }, 0);
          tl.set(els, { visibility: 'visible' }, t);
          tl.fromTo(els, { clipPath: 'inset(-20% 100% -30% 0%)' }, { clipPath: 'inset(-20% 0% -30% 0%)', duration: dur, ease: 'steps(8)', immediateRender: false }, t);
        };

        // ---- 0.12 title, 0.58 wallet (on the tight board)
        printOn(all('title'), 0.12, 0.48);
        Kit.plot(tl, all('wallet'), 0.58, { label: all('walletLabel') });

        // ---- 1.17 pull back to the room; the room assembles around the board
        crA.frame(tl, 1.17, 'full', { dur: 1.2 });
        Kit.stepIn(tl, crA.masthead, 1.3, { y: -8 });
        Kit.stepIn(tl, crA.binding, 1.4, { x: -10, y: 0 });
        Kit.stepIn(tl, ['ana', 'nika', 'gio', 'mari'].map((k) => crA.punches[k].seat).concat([crA.openSeat, crA.seats]), 1.45, { y: 0, scale: 0.8, stagger: 0.08 });
        Kit.hingeIn(tl, crA.rail, 1.55);
        const tabsA = Object.values(crA.tabs).map((t) => t.el);
        tl.set(tabsA, { visibility: 'hidden' }, 0);
        tabsA.forEach((t, i) => {
          tl.set(t, { visibility: 'visible' }, 1.65 + i * 0.1);
          tl.fromTo(t, { x: -40 }, { x: 0, duration: Kit.STEP, ease: 'steps(2)', immediateRender: false }, 1.65 + i * 0.1);
        });
        Kit.stepIn(tl, [crA.controls, crA.caption], 1.85, { y: 8 });
        Kit.stamp(tl, crA.phase, 2.33, { from: 1.2 });

        // ---- the page keeps plotting
        Kit.plot(tl, all('program'), 1.75, { label: all('programLabel') });
        Kit.plot(tl, all('arrow'), 2.92, { dur: 0.54, label: all('arrowLabel') });
        Kit.plot(tl, all('circle'), 3.5, { label: all('circleLabel') });
        Kit.fillIn(tl, all('circleFill'), 4.08);

        // ---- 4.67 THE PULL-BACK: ანა's screen becomes one of four devices
        const W = { x: -2690, y: -44, w: 4800, h: 3176 };
        const T = { x: 80, y: 40, w: 1760, h: 850 };
        const ws = Math.min(T.w / W.w, T.h / W.h);
        const WIDE = { scale: ws, x: T.x + (T.w - W.w * ws) / 2 - W.x * ws, y: T.y + (T.h - W.h * ws) / 2 - W.y * ws };
        gsap.set(world, { scale: 1, x: 0, y: 0 });
        Kit.camera(tl, world, 4.67, WIDE, { dur: 1.3, ease: 'expo.inOut' });
        crA.frame(tl, 4.67, 'device', { dur: 1.3, ease: 'expo.inOut' });
        Kit.stepIn(tl, qa('.s06-tag'), 5.4, { y: 30, stagger: 0.1 });

        // same stroke, same frame, four screens
        printOn(all('formula'), 5.83, 0.6);
        tl.set(all('note'), { visibility: 'hidden' }, 0);
        tl.set(all('note'), { visibility: 'visible' }, 6.42);
        tl.fromTo(all('note'), { clipPath: 'inset(0% 0% 100% 0%)', opacity: 0.6 }, { clipPath: 'inset(0% 0% 0% 0%)', opacity: 1, duration: 0.36, ease: 'steps(4)', immediateRender: false }, 6.42);

        // ---- 7.00 push back into ანა's screen, onto the lesson (board + caption fitted to the safe area)
        Kit.camera(tl, world, 7.0, { scale: 1, x: 0, y: 0 }, { dur: 1.2, ease: 'expo.inOut' });
        crA.frame(tl, 7.0, 'lesson', { dur: 1.2, ease: 'expo.inOut', target: 'safe' });

        // the ask bar would sit under the subtitle strip in the lesson framing: it steps away there
        tl.to(crA.controls, { opacity: 0, y: 8, duration: 0.066, ease: 'steps(2)' }, 7.85);
        tl.to(crA.controls, { opacity: 1, y: 0, duration: Kit.STEP, ease: 'steps(2)' }, 11.2);

        // ---- signals from the class
        Kit.stepIn(tl, all('chipGot'), 9.33, { y: 0, scale: 1.12 });
        Kit.stepIn(tl, all('chipConfused'), 10.5, { y: 0, scale: 1.12 });

        // ---- 11.08 to the end frame: the whole room, question rail on the right
        crA.frame(tl, 11.08, 'full', { dur: 1.2 });

        tl.set({}, {}, 14);
        window.__timelines = window.__timelines || {};
        window.__timelines['s06-lesson'] = tl;
      })();
    </script>
  </div>
</template>
