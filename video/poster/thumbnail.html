<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Chalkroom Live thumbnail</title>
<link rel="stylesheet" href="../assets/chalk.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  .frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .book { position: absolute; left: 110px; top: 96px; width: 1640px; height: 888px; }
  .book .sheet { position: absolute; inset: 0; background: var(--leaf); border: 1.5px solid var(--leaf-edge);
    border-radius: var(--r-leaf); box-shadow: var(--shadow-leaf); }
  .book .under { transform: translate(8px, 8px); background: var(--paper-2); box-shadow: none; }
  .book .under2 { transform: translate(16px, 16px); background: var(--paper-3); box-shadow: none; }
  .holes { position: absolute; left: 44px; top: 150px; display: flex; flex-direction: column; gap: 40px; }
  .holes .punch { width: 84px; height: 84px; font-size: 38px; }
  .holes .open { box-shadow: var(--shadow-punch); outline: 3px dashed var(--rule-2); outline-offset: 4px; }
  .host-tab { position: absolute; left: -12px; top: -12px; width: 30px; height: 30px; background: var(--ink); color: var(--paper);
    font: 800 20px/30px var(--f-head); text-align: center; border-radius: 3px; }
  .running { position: absolute; left: 190px; right: 120px; top: 52px; display: flex; justify-content: space-between;
    align-items: baseline; border-bottom: 2.5px solid var(--ink); padding-bottom: 16px; }
  .running .brand { font: 800 30px/1 var(--f-head); font-stretch: 75%; letter-spacing: 0.16em; color: var(--ink); }
  .running .no { font: 400 30px/1 var(--f-mono); color: var(--ink-3); }
  .title { position: absolute; left: 186px; top: 150px; font-family: var(--f-head); font-weight: 850; font-stretch: 75%;
    font-size: 214px; line-height: 0.88; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
  .ka { position: absolute; left: 192px; top: 372px; font-family: var(--f-head); font-weight: 800; font-stretch: 78%;
    font-size: 66px; line-height: 1.14; color: var(--ink); width: 720px; }
  .board-mini { position: absolute; left: 930px; top: 372px; width: 620px; height: 300px; }
  .board-mini .board { width: 620px; height: 300px; }
  .board-mini .t { position: absolute; left: 34px; top: 26px; font: 700 30px/1 var(--f-head); font-stretch: 85%; color: var(--h-orange); }
  .board-mini svg { position: absolute; inset: 0; }
  .board-mini .lbl { position: absolute; font: 400 24px/1.15 var(--f-head); color: var(--ink); text-align: center; }
  .note { position: absolute; left: 1330px; top: 690px; width: 280px; background: var(--note); color: var(--note-ink);
    padding: 16px 20px; font: 400 25px/1.3 var(--f-read); transform: rotate(-2deg);
    box-shadow: 0 1.5px 0 rgba(60,45,15,0.18), 0 14px 22px -16px rgba(60,45,15,0.5); }
  .card { position: absolute; left: 192px; top: 610px; width: 640px; background: var(--leaf); border: 2.5px solid var(--ink);
    border-radius: var(--r-leaf); box-shadow: var(--shadow-leaf); padding: 22px 26px; }
  .card .stamp { color: var(--h-orange); height: 44px; font-size: 26px; }
  .card .q { margin-top: 16px; font: 700 38px/1.15 var(--f-head); font-stretch: 86%; color: var(--ink); }
  .card .who { margin-top: 12px; font: 700 24px/1 var(--f-head); color: var(--ink-2); letter-spacing: 0.05em; display: flex; gap: 22px; }
  .card .who i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .hf { position: absolute; left: 960px; top: 800px; transform: rotate(-3deg); color: var(--ink); height: 54px; font-size: 28px; }
  .tabs { position: absolute; left: 1756px; top: 150px; display: flex; flex-direction: column; gap: 10px; }
  .tabs b { display: block; width: 44px; height: 108px; border-radius: 0 8px 8px 0; }
</style>
</head>
<body>
<div class="frame paper-bg">
  <div class="tabs">
    <b style="background:var(--h-orange)"></b><b style="background:var(--h-teal)"></b><b style="background:var(--h-grass)"></b>
    <b style="background:var(--h-ultra)"></b><b style="background:var(--h-violet)"></b><b style="background:var(--h-sienna)"></b>
  </div>
  <div class="book">
    <div class="sheet under2"></div><div class="sheet under"></div><div class="sheet"></div>
    <div class="running"><span class="brand">CHALKROOM LIVE</span><span class="no">01</span></div>
    <div class="holes">
      <span class="punch ana" style="position:relative">ა<span class="host-tab">H</span></span>
      <span class="punch nika">ნ</span>
      <span class="punch gio">გ</span>
      <span class="punch mari">მ</span>
      <span class="punch open"></span>
    </div>
    <h1 class="title">Chalkroom Live</h1>
    <div class="ka">ცოცხალი გაკვეთილი AI მასწავლებლით. ერთად.</div>

    <div class="board-mini">
      <div class="board"></div>
      <div class="t">რა არის PDA?</div>
      <svg viewBox="0 0 620 300" width="620" height="300">
        <rect x="30" y="100" width="170" height="72" fill="none" stroke="#1b1a17" stroke-width="2.5"/>
        <rect x="236" y="104" width="150" height="64" fill="none" stroke="#1b1a17" stroke-width="2.5"/>
        <line x1="386" y1="136" x2="476" y2="136" stroke="#1b1a17" stroke-width="2.5"/>
        <polyline points="464,126 478,136 464,146" fill="none" stroke="#1b1a17" stroke-width="2.5"/>
        <circle cx="530" cy="136" r="44" fill="#fbe0d0" stroke="#e0672a" stroke-width="2.5"/>
        <text x="431" y="122" font-family="Archivo, 'Noto Sans Georgian', sans-serif" font-size="14" fill="#4a463d" text-anchor="middle">seeds + bump</text>
        <text x="250" y="244" font-family="'Source Serif 4', serif" font-size="30" fill="#1b1a17" text-anchor="middle">PDA = <tspan font-style="italic">H</tspan>(seeds, programId, bump)</text>
      </svg>
      <div class="lbl" style="left:30px;top:122px;width:170px">საფულე</div>
      <div class="lbl" style="left:236px;top:122px;width:150px">პროგრამა</div>
      <div class="lbl" style="left:486px;top:122px;width:88px">PDA</div>
    </div>
    <div class="note">PDA-ს ხელს მხოლოდ პროგრამა აწერს</div>

    <div class="card">
      <span class="stamp">დაჯგუფდა · 2 იკითხა</span>
      <div class="q">რატომ ვერ აწერს PDA ხელს?</div>
      <div class="who"><span><i style="background:var(--p-gio)"></i>გიო</span><span><i style="background:var(--p-mari)"></i>მარი</span></div>
    </div>
    <span class="stamp hf">HACKTOBERFEST GEORGIA 2026</span>
  </div>
  <div class="film-grain"></div>
  <div class="film-vignette"></div>
</div>
</body>
</html>
